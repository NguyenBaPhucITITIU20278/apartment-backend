<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .message {
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .message.unread {
            background-color: #f0f0f0;
        }
        .message.read {
            background-color: #e8f5e9;
        }
        .read-status {
            font-size: 12px;
            color: #666;
            margin-left: 10px;
        }
        .system-message {
            color: #666;
            font-style: italic;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div>
        <h2>WebSocket Test</h2>
        <div>
            <button onclick="connectAsAdmin()">Connect as Admin</button>
            <button onclick="connectAsUser()">Connect as User</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>
        <br>
        <div>
            <input type="text" id="message" placeholder="Type a message...">
            <button onclick="sendMessage()">Send Message</button>
        </div>
        <div id="log"></div>
    </div>

    <script>
        let stompClient = null;
        let role = '';
        let unreadMessages = new Set();

        function formatMessage(message, isRead) {
            if (typeof message === 'string') {
                return `<div class="system-message">${message}</div>`;
            }

            const messageObj = typeof message === 'object' ? message : JSON.parse(message);
            const readClass = isRead ? 'read' : 'unread';
            const readStatus = isRead ? 'Đã đọc' : 'Chưa đọc';
            const isAdmin = role === 'admin';
            
            return `
                <div class="message ${readClass}" data-message-id="${messageObj.id}" data-sender-id="${messageObj.senderId}">
                    <strong>${messageObj.senderId}:</strong> ${messageObj.content}
                    <span class="read-status">${readStatus}</span>
                    ${isAdmin ? `
                        ${!isRead ? `<button onclick="markAsRead(${messageObj.id})">Đánh dấu đã đọc</button>` : ''}
                        <button onclick="replyToUser('${messageObj.senderId}')">Trả lời</button>
                    ` : ''}
                </div>`;
        }

        function log(message, isRead = true) {
            const logDiv = document.getElementById('log');
            if (typeof message === 'string') {
                if (message.startsWith('Connected:')) {
                    logDiv.innerHTML += formatMessage('🟢 ' + message, true);
                } else if (message.startsWith('Disconnected')) {
                    logDiv.innerHTML += formatMessage('🔴 ' + message, true);
                } else {
                    logDiv.innerHTML += formatMessage(message, true);
                }
            } else {
                try {
                    logDiv.innerHTML += formatMessage(message, isRead);
                } catch (e) {
                    console.error("Error formatting message:", e);
                    logDiv.innerHTML += formatMessage("Error displaying message", true);
                }
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function connectAsAdmin() {
            role = 'admin';
            connect();
            // Lấy danh sách tin nhắn chưa đọc khi admin kết nối
            fetch('http://localhost:8080/api/chat/unread/testuser', {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(messages => {
                if (Array.isArray(messages)) {
                    messages.forEach(msg => {
                        unreadMessages.add(msg.id);
                        log(msg, false);
                    });
                } else {
                    console.error('Expected array of messages but got:', messages);
                    log('Error: Invalid message format received');
                }
            })
            .catch(error => {
                console.error('Error fetching unread messages:', error);
                log('Error loading unread messages');
            });
        }

        function connectAsUser() {
            role = 'user';
            connect();
        }

        function connect() {
            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // Disable debug logs

            const connectHeaders = {
                'X-Requested-With': 'XMLHttpRequest'
            };

            stompClient.connect(connectHeaders, function(frame) {
                log('Connected to WebSocket');
                
                // Subscribe to personal messages for both user and admin
                const userId = role === 'admin' ? 'testuser' : 'Phuc58';
                stompClient.subscribe(`/user/${userId}/queue/messages`, function(message) {
                    try {
                        const messageData = JSON.parse(message.body);
                        if (role === 'admin') {
                            unreadMessages.add(messageData.id);
                        }
                        log(messageData, false);
                    } catch (e) {
                        console.error('Error processing received message:', e);
                    }
                });

                // Subscribe to read receipts only for admin
                if (role === 'admin') {
                    stompClient.subscribe('/user/testuser/queue/read-receipts', function(receipt) {
                        try {
                            const {messageId} = JSON.parse(receipt.body);
                            updateMessageReadStatus(messageId);
                        } catch (e) {
                            console.error('Error processing read receipt:', e);
                        }
                    });
                }
            }, function(error) {
                log('Error connecting to WebSocket: ' + error);
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
                log('Disconnected from WebSocket');
                unreadMessages.clear();
            }
        }

        function sendMessage() {
            const messageInput = document.getElementById('message');
            const content = messageInput.value;
            const replyToUserId = messageInput.getAttribute('data-reply-to');
            
            if (stompClient !== null && content.trim()) {
                const chatMessage = {
                    content: content,
                    senderId: role === 'admin' ? 'testuser' : 'Phuc58',
                    receiverId: role === 'admin' ? replyToUserId : null,
                    adminIds: ['testuser']
                };
                
                stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
                log('Message sent: ' + content);
                messageInput.value = '';
                messageInput.removeAttribute('data-reply-to');
                messageInput.placeholder = "Type a message...";
            }
        }

        function replyToUser(userId) {
            const messageInput = document.getElementById('message');
            messageInput.setAttribute('data-reply-to', userId);
            messageInput.placeholder = `Trả lời ${userId}...`;
            messageInput.focus();
        }

        function markAsRead(messageId) {
            if (role === 'admin') {
                fetch(`http://localhost:8080/api/chat/read/${messageId}/testuser`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                }).then(() => {
                    updateMessageReadStatus(messageId);
                }).catch(error => {
                    console.error('Error marking message as read:', error);
                    log('Error marking message as read');
                });
            }
        }

        function updateMessageReadStatus(messageId) {
            const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (messageElement) {
                messageElement.classList.remove('unread');
                messageElement.classList.add('read');
                const readStatus = messageElement.querySelector('.read-status');
                if (readStatus) {
                    readStatus.textContent = 'Đã đọc';
                }
                const markReadButton = messageElement.querySelector('button');
                if (markReadButton) {
                    markReadButton.remove();
                }
            }
            unreadMessages.delete(messageId);
        }

        // Thêm event listener cho input field
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
